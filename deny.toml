[graph]
all-features = true
# Real build target only — keeps embedded/Linux-only transitive deps (atomic-polyfill,
# the Wayland stack) out of the checked graph. Add the Linux triple when server hosting lands.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
# Workspace crates are private (publish = false) — exempt from the license gate.
private = { ignore = true }
# Shipping-asset licensing gate (crate edition): permissive-only, no copyleft, no NC.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # egui's epaint_default_fonts: embedded-font licenses, redistribution-safe
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
