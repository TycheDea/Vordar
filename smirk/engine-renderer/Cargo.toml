[package]
name    = "engine-renderer"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
# Headless offscreen render harness — used by this crate's own
# tests/offscreen.rs and vordar-client's tests/ground_render.rs.
# Never enabled by normal builds.
offscreen = []

[dependencies]
engine-core = { path = "../engine-core" }
engine-app  = { path = "../engine-app" }
glam        = { workspace = true }
log         = { workspace = true }

pollster = "0.4.0"
wgpu   = { workspace = true }
winit  = { workspace = true }
bytemuck = "1.25.0"
ddsfile  = "0.5"
hecs = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
gltf = { version = "1.4.1", features = ["import", "KHR_materials_emissive_strength"] }
# Radiance .hdr decode for IBL environments (+ png/jpeg for ground texture
# sets); f32→f16 for Rgba16Float upload
image = { version = "0.25", default-features = false, features = ["hdr", "png", "jpeg"] }
half  = { version = "2", features = ["bytemuck"] }

[dev-dependencies]
# Self dev-dependency so tests/offscreen.rs sees the module without turning
# it on for normal (non-test) builds — same pattern as vordar-server's
# bench-internals.
engine-renderer = { path = ".", features = ["offscreen"] }
