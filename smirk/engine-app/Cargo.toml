[package]
name    = "engine-app"
version = "0.1.0"
edition = "2021"

[features]
# winit (default): window creation, event loop, keyboard input. Headless builds
# (dedicated server) disable default features and use App::run_headless().
default = ["winit"]
winit   = ["dep:winit"]

[dependencies]
engine-core = { path = "../engine-core" }
glam        = { workspace = true }
hecs        = { workspace = true }
log         = { workspace = true }
ron         = { workspace = true }
serde       = { workspace = true }
winit       = { workspace = true, optional = true }
notify      = "6"
