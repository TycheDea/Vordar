[package]
name    = "engine-app"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
# winit (default): window creation, event loop, keyboard input. Headless builds
# (dedicated server) disable default features and use App::run_headless().
# notify (the WindowConfig hot-reload watcher) rides along with winit — it
# has no reason to exist in a headless build.
default = ["winit"]
winit   = ["dep:winit", "dep:notify"]

[dependencies]
engine-core = { path = "../engine-core" }
glam        = { workspace = true }
hecs        = { workspace = true }
log         = { workspace = true }
ron         = { workspace = true }
serde       = { workspace = true }
winit       = { workspace = true, optional = true }
notify      = { version = "8", optional = true }
