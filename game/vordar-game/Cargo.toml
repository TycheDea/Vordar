[package]
name    = "vordar-game"
version = "0.1.0"
edition = "2021"

[dependencies]
engine-core    = { path = "../../smirk/engine-core" }
engine-app     = { path = "../../smirk/engine-app", default-features = false }
engine-physics = { path = "../../smirk/engine-physics" }
glam           = { workspace = true }
hecs           = { workspace = true }
serde          = { workspace = true }
ron            = { workspace = true }
log            = { workspace = true }
smallvec       = "1"

[dev-dependencies]
# Content-lint only (tests/content_lint.rs): CPU-side glTF parse via
# load_gltf_data — no GPU is touched.
engine-renderer = { path = "../../smirk/engine-renderer" }
