[package]
name    = "vordar-game"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
engine-core    = { path = "../../smirk/engine-core" }
engine-app     = { path = "../../smirk/engine-app", default-features = false }
engine-physics = { path = "../../smirk/engine-physics" }
glam           = { workspace = true }
hecs           = { workspace = true }
serde          = { workspace = true }
ron            = { workspace = true }
log            = { workspace = true }
smallvec       = { workspace = true }

[dev-dependencies]
# Content-lint only (tests/content_lint.rs): CPU-side glTF parse via
# load_gltf_data — no GPU is touched.
engine-renderer = { path = "../../smirk/engine-renderer" }
# Content-lint only: sidecar manifest parsing (serde_json) and source-asset
# hashing (sha2) for the material-texture sidecar freshness check.
serde_json      = "1"
sha2            = { workspace = true }
