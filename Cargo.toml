[workspace]
members = [
    "smirk/engine-core",
    "smirk/engine-app",
    "smirk/engine-renderer",
    "smirk/engine-physics",
    "smirk/engine-audio",
    "smirk/engine-net",
    "game/vordar-protocol",
    "game/vordar-game",
    "game/chapter-01",
    "game/chapter-02",
    "game/chapter-03",
    "client/vordar-client",
    "server/vordar-server",
    "benchmarks",
    "testing/test-support",
]
resolver = "3"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Shared versions — all crates pull from here
glam    = { version = "0.32", features = ["serde"] }
hecs    = "0.11"
serde   = { version = "1", features = ["derive"] }
ron     = "0.12"
log     = "0.4"
winit   = "0.30"
egui    = "0.34"   # engine-renderer draws with it; the game registers UiLayers callbacks
egui-wgpu  = "0.34"
egui-winit = "0.34"
wgpu       = "29"
smallvec   = "1"

# Networking (engine-net, protocol, server, client)
tokio    = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
quinn    = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls   = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen    = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
postcard = { version = "1", features = ["use-std"] }
# Datagram lane (engine-net, networking rework 3 finding 2): quinn's
# `Connection::send_datagram`/`read_datagram` are typed on `bytes::Bytes`.
bytes    = "1"

# Persistence (server only).
rusqlite = { version = "0.40", features = ["bundled"] }

# Account token hashing (server only, networking rework 1 finding 2): tokens
# are hashed at rest, never stored raw.
sha2 = "0.10"

# Constant-time comparison for auth material (server only): timing must
# never leak byte-position information from a token or digest compare.
subtle = "2.6"

# Account token minting (client only, networking rework 1 finding 3): the
# real client mints its 32-byte token once via the OS CSPRNG.
getrandom = "0.3"

# Signal handling (server only): SIGINT/SIGTERM on Unix, Ctrl+C/console-close
# on Windows, in one `set_handler` call (networking rework plan 2026-07-12,
# finding 4).
ctrlc = { version = "3", features = ["termination"] }

# Benchmarks only (vordar-benches). No plotters/HTML — headless, faster builds.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Line tables only (debug=1): panics and backtraces stay symbolicated, but the
# full DWARF/PDB that debug=2 emits — 13.8 GiB across the test binaries, most of
# it never opened in a debugger — is dropped. Test binaries inherit this via the
# test profile.
[profile.dev]
debug = 1

# Keep symbols in bench builds for future flamegraph work — no runtime cost.
[profile.bench]
debug = true
