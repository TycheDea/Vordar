[package]
name    = "vordar-client"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
name = "vordar_client"

[features]
# Exposes private netcode internals to vordar-benches. Never enabled by
# normal builds — same pattern as vordar-server's bench-internals.
bench-internals = []
# Forwards to engine-renderer's offscreen feature; gates render_material
# exactly as engine-renderer's own [features]/[[bin]] gate turntable.
offscreen = ["engine-renderer/offscreen"]

[[bin]]
name = "sandbox"
path = "src/bin/sandbox.rs"

[[bin]]
name = "vordar"
path = "src/bin/vordar.rs"

[[bin]]
name = "render_material"
path = "src/bin/render_material.rs"
required-features = ["offscreen"]

[[bin]]
name = "gear_render"
path = "src/bin/gear_render.rs"
required-features = ["offscreen"]

[[bin]]
name = "zone_review"
path = "src/bin/zone_review.rs"
required-features = ["offscreen"]

[dependencies]
engine-core     = { path = "../../smirk/engine-core" }
engine-app      = { path = "../../smirk/engine-app" }
engine-renderer = { path = "../../smirk/engine-renderer" }
engine-physics  = { path = "../../smirk/engine-physics" }
engine-net      = { path = "../../smirk/engine-net" }
vordar-game     = { path = "../../game/vordar-game" }
vordar-protocol = { path = "../../game/vordar-protocol" }
chapter-01      = { path = "../../game/chapter-01" }
chapter-02      = { path = "../../game/chapter-02" }
glam            = { workspace = true }
hecs            = { workspace = true }
winit           = { workspace = true }
log             = { workspace = true }
egui            = { workspace = true }
ron             = { workspace = true }
getrandom       = { workspace = true }
# Direct deps (not dev-only): the render_material bin needs wgpu::Color and
# PNG encoding, and a [[bin]] target can't see dev-dependencies.
wgpu            = { workspace = true }
image           = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# egui 0.34-matched: wgpu-backed offscreen rendering + PNG snapshot compare.
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }
# engine-renderer's offscreen module is feature-gated — enable it here so
# this test build sees it without shipping it in vordar.
engine-renderer = { path = "../../smirk/engine-renderer", features = ["offscreen"] }
# Headless integration tests drive a real server the same way vordar-server's
# own e2e suite does.
vordar-server = { path = "../../server/vordar-server" }
test-support  = { path = "../../testing/test-support" }
