[package]
name    = "vordar-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "vordar_client"

[features]
# Exposes private netcode internals to vordar-benches. Never enabled by
# normal builds — same pattern as vordar-server's bench-internals.
bench-internals = []

[[bin]]
name = "sandbox"
path = "src/bin/sandbox.rs"

[[bin]]
name = "vordar"
path = "src/bin/vordar.rs"

[dependencies]
engine-core     = { path = "../../smirk/engine-core" }
engine-app      = { path = "../../smirk/engine-app" }
engine-renderer = { path = "../../smirk/engine-renderer" }
engine-physics  = { path = "../../smirk/engine-physics" }
engine-net      = { path = "../../smirk/engine-net" }
vordar-game     = { path = "../../game/vordar-game" }
vordar-protocol = { path = "../../game/vordar-protocol" }
chapter-01      = { path = "../../game/chapter-01" }
chapter-02      = { path = "../../game/chapter-02" }
glam            = { workspace = true }
hecs            = { workspace = true }
winit           = { workspace = true }
log             = { workspace = true }
egui            = { workspace = true }
ron             = { workspace = true }
getrandom       = { workspace = true }

[dev-dependencies]
# Offscreen render tests (tests/ground_render.rs) pass wgpu types to the
# engine's headless harness.
wgpu = "29"
# net.rs's reconnect test (networking audit 2026-07-11, finding 7) drives a
# real headless server the same way vordar-server's own e2e suite does.
vordar-server = { path = "../../server/vordar-server" }
test-support  = { path = "../../testing/test-support" }
