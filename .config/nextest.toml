# Workspace test-runner config for cargo-nextest (the workers' full-suite gate:
# `cargo nextest run --workspace` + `cargo test --doc --workspace`; nextest does
# not run doc-tests).
#
# The vordar-server integration binaries spin real servers with closed-loop
# bots; their tests are timing-sensitive under CPU contention, so they run in a
# capped test group instead of nextest's full default parallelism. The client
# lib's real-server e2e tests share the same sensitivity.
#
# On top of the cap, tests that drive a closed-loop bot against a wall-clock
# deadline are EXCLUSIVE: `threads-required = "num-cpus"` makes each occupy
# every worker slot, so nothing else runs beside it (the group cap alone does
# not stop unrelated tests from loading the CPU next to them).
# Renaming one of these tests MUST update this filter list.
#
# MEASURED COST (2026-07-15): exclusive-test isolation costs 6.45s per full
# run (3.37s + 2.06s + 1.02s with all cores idle). Isolation is retained: the
# rerun cost (40s + attribution confusion) outweighs the 6.45s fixed cost.
#
# MEASURED (2026-07-17), rend_kills_camped_enemy: its residual flake was NOT a
# missed kill deadline. Every reproduced failure fired "the bot must survive
# the fight" at 8-13.7s against a 25s deadline — the bot died, so widening
# that deadline was inert. Cause: at the player's fixed 6.0 u/s, a snapshot
# interval stretched to ~100ms under load is ~0.6u of position uncertainty,
# which is wider than any hold-station band fitting between the 1.0 contact
# boundary and rend's 2.5 max_range; the bot oscillated across contact and
# re-billed 10 damage per cycle until its 100 HP were gone. Fixed in the test
# by removing the station-keeping entirely (close to 3.0, then stand and let
# the charger arrive), which also cut it from 3.68s to ~3.3s mean. Verified
# 5/5 green idle and 5/5 under 20-way CPU oversubscription.
#
# MEASURED (2026-07-17, plan-devloop-rework-3-2026-07-17.md finding 5
# proof): bot verdicts in scope (rend_kills_camped_enemy,
# kicked_connection_reconnects_and_relogs_in, scheduled_aoe) gate on
# replicated sim ticks via SimDeadline (Snapshot.tick-paced,
# testing/test-support/src/bot.rs), send_move is sim-paced, wall clocks only
# backstop at 8x (WALL_BACKSTOP_FACTOR), and scheduled_aoe's dodge assert
# carries a 0.9 sim-rate precondition. Re-running the proof also caught a
# pre-existing bug in the exclusive-override filter below: nextest's
# `test(=NAME)` requires the fully-qualified name, but
# kicked_connection_reconnects_and_relogs_in and
# onslaught_dash_replay_never_snaps_at_150ms_rtt only exist as
# `net::e2e::<name>` — the bare names matched zero tests (confirmed via
# `cargo nextest list`), so both silently ran in the capped 'realtime' group
# instead of exclusively. Fixed by qualifying both names below. With that
# fixed: sensitive-set x10 at -Load 3.0 (60 spinners, 20-logical-core
# machine) held onslaught_dash_replay_never_snaps_at_150ms_rtt and
# predicted_wall_hug_never_snaps_at_150ms_rtt green in all 10 runs — 9/10
# runs fully green across all 5 tests, the one failure (run 9) being
# scheduled_aoe's dodge assert, not a prediction test. The full 404-test
# suite ran once at -Load 3.0 clean: 404 passed, 0 failed. An idle full gate
# afterward (cargo nextest run --workspace + cargo test --doc --workspace)
# held 404/404. The suite IS proven green at 3x CPU oversubscription for the
# two prediction tests; see rework 3,
# docs/reviews/devloop/reworks-devloop-2026-07-17.md, struck on this
# evidence. scheduled_aoe's dodge assert now carries a second precondition,
# DODGE_PRE_T_SENDS_MIN (server/vordar-server/tests/e2e_combat.rs:104),
# alongside sim_rate; sensitive-set x10 at -Load 3.0 held it green in all 10
# runs, closing rework 2 (docs/reviews/devloop/reworks-devloop-2026-07-17.md,
# plan-devloop-rework-5-2026-07-17.md finding 4). Exclusive scheduling is
# retained: it is what let this proof reach clean green.

[test-groups]
realtime = { max-threads = 4 }

# Exclusive closed-loop deadline tests (first matching override wins, so this
# block must precede the group assignments below).
[[profile.default.overrides]]
filter = 'test(=rend_kills_camped_enemy) | test(=net::e2e::kicked_connection_reconnects_and_relogs_in) | test(=net::e2e::onslaught_dash_replay_never_snaps_at_150ms_rtt)'
test-group = '@global'
threads-required = 'num-cpus'

[[profile.default.overrides]]
filter = 'package(vordar-server) and kind(test)'
test-group = 'realtime'

[[profile.default.overrides]]
filter = 'package(vordar-client) and kind(lib)'
test-group = 'realtime'

[[profile.default.overrides]]
filter = 'package(test-support) and kind(test)'
test-group = 'realtime'
